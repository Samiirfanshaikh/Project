<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<style>
nav{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.middle{
  display: flex;
  gap: 40px;
}
.right{
  display: flex;
  gap: 18px;
  align-items: center;
}
.main{
    min-height: 800px;
    border: 2px solid black;
  border-radius: 40px;
  padding-left: 60px;
  margin: 20px;
  background:
            url(https://plus.unsplash.com/premium_photo-1689568126014-06fea9d5d341?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bWFsZSUyMHByb2ZpbGV8ZW58MHx8MHx8fDA%3D);background-size: cover;
            background-position: center;
            color: white;
            font-size: x-large;
}
.inner{
  margin-top: 450px;
}
button{
  background-color: white;
  color: black;
  padding: 15px;
  border-radius: 30px;
  font-weight:700;
  font-size: large;
}
</style>
</head>
<body>
  <nav>
    <div class="left"><h1>🟢 Excora</h1></div>
    <div class="middle">
      <p>About</p>
      <p>Service</p>
      <p>Case Studies</p>
      <p>Articles</p>
    </div>
    <div class="right">
      <p style="border: 1px solid black; padding:10px; border-radius: 20px;">Contact Us</p>
      <p style="border: 1px solid black; padding:10px; border-radius: 20px; height: 10px; width: 10px;
                display: flex; justify-content: center;">🕻</p>
    </div>
  </nav>
  <div class="main">
    <div class="inner">
    <span><h1>Strategic Clarity <br> Sustainable Growth. </h1> </span>
    <span><p>We help businesses refine strategy,strengthen operation,scale with<br> confidence through data-driven consulting and practical execution</p></span>
    <button>Book a call ➜</button>
    </div>
  </div>

</html>
